{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg agro-nav sticky-top">
  <div class="container">
    <a class="navbar-brand brand" href="{% url 'inicio' %}">🥑 Agro<span class="accent">Aguacate</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-label="Menú">
      <i class="bi bi-list fs-2"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-4 gap-lg-1">
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'inicio' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'catalogo' %}active{% endif %}" href="{% url 'catalogo' %}">Catálogo</a></li>
      </ul>
      <div class="dropdown">
        <button class="btn d-flex align-items-center gap-2 border-0 px-0" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="avatar">{{ user.nombre|slice:":1"|upper }}</span>
          <span class="small fw-semibold d-none d-sm-inline">{{ user.nombre }}</span>
          <i class="bi bi-chevron-down small text-muted"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
          <li><span class="dropdown-item-text small text-muted">{{ user.email }}</span></li>
          {% if user.is_staff %}<li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-gear me-2"></i>Administración</a></li>{% endif %}
          <li><hr class="dropdown-divider"></li>
          <li>
            <form id="logout-form" method="post" action="{% url 'logout' %}" class="m-0">
              {% csrf_token %}
              <button type="submit" class="dropdown-item text-danger">
                <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
{% endif %}
