{% extends "base_auth.html" %}
{% block title %}Revisa tu correo{% endblock %}
{% block auth_content %}
<div class="text-center">
  <i class="bi bi-envelope-check display-3 text-success"></i>
  <h1 class="auth-title mt-3">Revisa tu correo</h1>
  <p class="text-muted">Si el correo está registrado, recibirás un enlace que vence en 30 minutos y solo funciona una vez.</p>
  <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100 mt-3">Volver a iniciar sesión</a>
</div>
{% endblock %}
{% block extra_js %}
<script>
  AgroSwal.fire({
    icon: 'success', title: 'Solicitud enviada',
    text: 'Si el correo está registrado, te enviamos las instrucciones.',
    confirmButtonText: 'Entendido',
  });
</script>
{% endblock %}
